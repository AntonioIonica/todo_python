<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pending List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abel&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abel&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #5cc929;
        font-family: "Abel", sans-serif;
        font-weight: 400;
        font-style: normal;
        color: #c929ac;
        padding: 40px 25px;
      }

      .container {
        max-width: 600px;
        margin: auto;
        background-color: #94c77e;
        -webkit-box-shadow: 2px 2px 13px -4px #c929ac;
        box-shadow: 2px 2px 13px -4px #c929ac;
        padding: 12px 8px;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Abel", sans-serif;
        font-weight: 800;
        font-style: normal;
      }

      a,
      p {
        color: #6f2361;
      }

      #logout-btn {
        background: none;
        border: none;
        color: #ffffff;
        font-weight: 700;
        font-size: medium;
        font-style: bold;
        letter-spacing: 1.4px;
      }

      #logout-btn:hover {
        text-transform: scale(2);
        border: 2px solid #ffffff;
        border-radius: 5px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        color: #ffffff;
        padding: 10px;
        border-radius: 8px 8px 0 0;
        background: linear-gradient(
          90deg,
          #63c2e1 0%,
          #4ea5c1 43%,
          #12586f 100%
        );
      }

      .top-bar :last-child {
        margin-top: 5px;
        margin-right: 5px;
      }

      .top-bar a {
        color: rgb(255, 255, 255);
        text-decoration: none;
      }

      .wrapper-task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 2px;
        border-top: solid 1px rgb(225, 225, 225);
        background-color: #ffffff;
        padding: 12px 20px;
        font-size: larger;
      }

      .task-title {
        display: flex;
        align-items: center;
      }

      .task-title a {
        margin-left: 5px;
        text-decoration: none;
        color: #4b5156;
      }

      .icon-complete-task {
        width: 20px;
        height: 20px;
        background-color: rgb(72, 140, 72);
        border-radius: 50px;
      }

      .icon-incomplete-task {
        width: 20px;
        height: 20px;
        background-color: rgb(163, 132, 132);
        border-radius: 50px;
      }

      .delete-link {
        text-decoration: none;
        font-weight: 900;
        font-size: larger;
        line-height: 0;
        color: #ea4220;
      }

      #wrapper-create-search {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
      }

      #wrapper-create-search input:nth-child(2) {
        margin-left: 8px;
      }

      #create-link {
        display: flex;
        align-items: center;
        color: #051b76;
        text-decoration: none;
        font-size: 42px;
        text-shadow: 1px 1px #1b0690;
      }

      input[type="text"],
      input[type="password"],
      textarea,
      #search-box {
        border: 1px solid #eb696f;
        border-radius: 5px;
        padding: 10px;
        width: 90%;
      }

      label {
        padding-top: 10px !important;
        display: block;
      }

      .button {
        border: 1px solid #eb796f;
        background-color: #fafafa;
        color: #eb796f;
        padding: 10px;
        font-size: 14px;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
      }

      .card-body {
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">{% block content %} {% endblock content %}</div>
  </body>
</html>
