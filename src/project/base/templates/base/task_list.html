<h1>Pending List</h1>

<div>
  <h2><a href="{% url 'create-task' %}">Create New Task</a></h2>
</div>

<table>
  <tr>
    <th>Items</th>
    <th></th>
  </tr>

  {% for task in tasks %}
  <tr>
    <td>{{ task.title }}</td>
    <td><a href="{% url 'task' task.id %}">See details</a></td>
  </tr>

  {% empty %}
  <h3>There are not items in the list!</h3>

  {% endfor %}
</table>
